<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tinyux minimal example</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2032%2032%27%3E%3Ccircle%20cx%3D%2716%27%20cy%3D%2716%27%20r%3D%2715%27%20fill%3D%27%232540FF%27%20fill-opacity%3D%27.16%27%2F%3E%3Ccircle%20cx%3D%2716%27%20cy%3D%2716%27%20r%3D%2710.5%27%20fill%3D%27%232540FF%27%20fill-opacity%3D%27.36%27%2F%3E%3Ccircle%20cx%3D%2716%27%20cy%3D%2716%27%20r%3D%276.2%27%20fill%3D%27%232540FF%27%2F%3E%3C%2Fsvg%3E">
  <link rel="stylesheet" href="./site.css">
</head>
<body>
  <header>
    <div class="container header-inner">
      <a class="brand" href="./index.html"><svg class="logo-mark" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true" focusable="false"><circle cx="16" cy="16" r="14.5" fill="#2540FF" fill-opacity=".13"/><circle cx="16" cy="16" r="10" fill="#2540FF" fill-opacity=".3"/><circle cx="16" cy="16" r="5.6" fill="#2540FF"/></svg><span class="brand-name">tinyux</span></a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation" aria-label="Open navigation menu" data-menu-toggle>
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav id="primary-navigation" class="site-nav" aria-label="Primary">
        <a class="nav-link" href="./docs.html">Docs</a>
        <a class="nav-link" href="./demo/product.html">Full demo</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="hero">
      <div class="container hero-inner">
        <span class="eyebrow">minimal example</span>
        <h1>One button, one survey, one collector.</h1>
        <p class="lead">Open DevTools Network and click the button. Update `data-api-url` if you are not running the local demo server.</p>
        <div class="cta-row">
          <button class="btn btn-primary" data-product="premium" data-tinyux-trigger="click" data-tinyux-survey-id="post-cta">Upgrade to Premium</button>
          <button class="btn" id="ask-now">Ask survey now</button>
        </div>
      </div>
    </section>
  </main>

  <script src="./site.js"></script>
  <script
    src="./tinyux.js"
    data-app-id="example"
    data-api-url="/collect"
    data-config='{"debug":true,"surveys":{"maxPerSession":3,"minIntervalMinutes":0}}'></script>
  <script>
    const ux = window.tinyux.getInstance()
    ux.registerSurvey({
      id: 'post-cta',
      type: 'rating',
      title: 'Quick check',
      question: 'How helpful was the {{data-product}} message?',
      scale: 5,
      cooldownMinutes: 0
    })
    document.getElementById('ask-now').addEventListener('click', () => ux.showSurvey('post-cta'))
  </script>
</body>
</html>
